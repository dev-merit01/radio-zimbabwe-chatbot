name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voting
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: voting
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-deployment
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgres://voting:test-only@localhost:5432/voting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check --select F,E9 apps radio_zimbabwe desktop
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: pytest -q
      - run: pip-audit -r requirements.txt
      - run: node --check static/workspace/studio.js
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python manage.py migrate --noinput
      - run: python manage.py shell < tests/browser/seed.py
      - name: Browser workflows
        run: |
          python manage.py runserver 127.0.0.1:8765 --noreload > /tmp/voting-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8765/accounts/login/ >/dev/null && break; sleep 1; done
          npm run test:browser
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: ./desktop/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: VotingStudio-Windows-Installer
          path: dist/installer/*.exe
          if-no-files-found: error
