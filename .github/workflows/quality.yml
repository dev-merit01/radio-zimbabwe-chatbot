name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voting
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: voting
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-deployment
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgres://voting:test-only@localhost:5432/voting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check --select F,E9 apps radio_zimbabwe desktop
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: pytest -q
      - run: pip-audit -r requirements.txt
      - run: node --check static/workspace/studio.js
      - name: Build production server image
        run: docker build -t airvote-server:ci .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run desktop:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:desktop-ui
      - run: python manage.py migrate --noinput
      - run: python manage.py shell < tests/browser/seed.py
      - name: Browser workflows
        run: |
          python manage.py runserver 127.0.0.1:8765 --noreload > /tmp/voting-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8765/accounts/login/ >/dev/null && break; sleep 1; done
          python manage.py run_vote_worker > /tmp/airvote-worker.log 2>&1 &
          npm run test:browser
          npm run test:airvote
          npm run test:editions
  windows:
    runs-on: windows-latest
    env:
      VOTING_STUDIO_SERVER_URL: ${{ vars.VOTING_STUDIO_SERVER_URL }}
      AIRVOTE_UPDATER_PUBLIC_KEY: ${{ vars.AIRVOTE_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run desktop:check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Tauri Windows installer with WebView2
        shell: pwsh
        run: |
          if (![string]::IsNullOrWhiteSpace($env:AIRVOTE_UPDATER_PUBLIC_KEY) -and
              ![string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            npm run desktop:build
          } else {
            Write-Host 'Updater signing is not configured: CI validation installer only.'
            npm run desktop:build -- --config src-tauri/tauri.unsigned.conf.json
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Install and launch smoke test
        shell: pwsh
        run: ./desktop/smoke.ps1
      - name: Installer checksums
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if (!$installers.Count) { throw 'No Windows installer was produced.' }
          $installers | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }
          if (![string]::IsNullOrWhiteSpace($env:AIRVOTE_UPDATER_PUBLIC_KEY) -and
              ![string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            $signatures = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe.sig)
            if (!$signatures.Count) { throw 'Signed installer is missing its Tauri update signature.' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AirVote-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AirVote-Rust-lockfile
          path: src-tauri/Cargo.lock
          if-no-files-found: warn

  release:
    # Without the public key variable, do not publish an unsigned auto-update.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.AIRVOTE_UPDATER_PUBLIC_KEY != ''
    needs: [backend, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AirVote-Windows-x64
          path: release-assets
      - name: Publish signed Windows installer and updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          test "$version" = "$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          installer="AirVote_${version}_x64-setup.exe"
          test -s "release-assets/$installer"
          test -s "release-assets/$installer.sig" || { echo 'Missing updater signature: set TAURI_SIGNING_PRIVATE_KEY in repository secrets.'; exit 1; }
          (cd release-assets && sha256sum -c "$installer.sha256")
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "AirVote $version already published. Bump the app version for the next desktop release."
            exit 0
          fi
          signature="$(tr -d '\r\n' < "release-assets/$installer.sig")"
          url="https://github.com/${GH_REPO}/releases/download/v${version}/${installer}"
          jq -n --arg version "$version" --arg url "$url" --arg signature "$signature" --arg notes "Signed desktop updates and expanded native menus."             '{version: $version, notes: $notes, platforms: {"windows-x86_64": {signature: $signature, url: $url}}}'             > release-assets/latest.json
          git archive --format=zip --prefix="AirVote-${version}-source/" --output="release-assets/AirVote-${version}-source.zip" "$GITHUB_SHA"
          (cd release-assets && sha256sum "AirVote-${version}-source.zip" > "AirVote-${version}-source.zip.sha256")
          gh release create "v$version" release-assets/* --target "$GITHUB_SHA"             --title "AirVote $version" --notes "Signed Windows update checking and installation; professional desktop menus." --latest
