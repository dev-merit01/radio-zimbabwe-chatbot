[package]
name = "voting-studio"
version = "2.1.0"
description = "Radio Zimbabwe Voting Studio for Windows"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-single-instance = "=2.4.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
codegen-units = 1
strip = true
